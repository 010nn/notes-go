services:
   db:
      image: postgres:15-alpine
      restart: always
      environment:
         POSTGRES_DB: ${DB_NAME}
         POSTGRES_USER: ${DB_USER}
         POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
         - pgdata:/var/lib/postgresql/data
      expose:
         - "5432"
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
         interval: 5s
         timeout: 5s
         retries: 5

   migration:
      build:
         context: .
         dockerfile: docker/${BUILD_STRATEGY}/Dockerfile
         target: migration
      command: ["./migration"]
      depends_on:
         db:
            condition: service_healthy
      environment:
         - DB_HOST=db
         - DB_PORT=5432
         - DB_USER=${DB_USER}
         - DB_PASSWORD=${DB_PASSWORD}
         - DB_NAME=${DB_NAME}
         - DB_SSLMODE=disable

   app:
      build:
         context: .
         dockerfile: docker/${BUILD_STRATEGY}/Dockerfile
         target: app
      command: ["./app"]
      depends_on:
         migration:
            condition: service_completed_successfully
      environment:
         - DB_HOST=db
         - DB_PORT=5432
         - DB_USER=${DB_USER}
         - DB_PASSWORD=${DB_PASSWORD}
         - DB_NAME=${DB_NAME}
         - DB_SSLMODE=disable
         - APP_PORT=8080
         - JWT_SECRET=${JWT_SECRET}
         - JWT_ACCESS_EXPIRATION_MINUTES=${JWT_ACCESS_EXPIRATION_MINUTES}
      restart: unless-stopped

   nginx:
      image: nginx:alpine
      ports:
         - "${NGINX_HTTP_PORT:-80}:80"
         - "${NGINX_HTTPS_PORT:-443}:443"
      environment:
         - CERT_FILE=${CERT_FILE}
         - KEY_FILE=${KEY_FILE}
         - APP_PORT=${APP_PORT}
      volumes:
         - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
         - ${HOST_CERTS_DIR}:/etc/nginx/ssl:ro
         - ./static:/var/www/static:ro
      depends_on:
         - app
      restart: unless-stopped

volumes:
   pgdata:
