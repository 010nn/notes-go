<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notes go</title>
    <link rel="stylesheet" href="static/css/style.css" />
    <link
      rel="icon"
      href="https://img.icons8.com/?size=100&id=12581&format=png&color=000000"
    />
    <script type="module" src="static/js/auth.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body>
    <div class="auth-container" x-data="authApp">
      <h2 class="auth-container__title">Login</h2>
      <form
        class="auth-form"
        @submit.prevent="submitLogin"
        novalidate
        :aria-busy="loading"
      >
        <div class="auth-form__group">
          <input
            x-ref="username"
            x-model.trim="username"
            type="text"
            autocomplete="username"
            maxlength="32"
            :disabled="loading"
            placeholder=" "
            required
          />
          <label for="username">Username</label>
        </div>

        <div class="auth-form__group">
          <input
            x-model="password"
            type="password"
            autocomplete="current-password"
            minlength="3"
            maxlength="64"
            :disabled="loading"
            placeholder=" "
            required
          />
          <label for="password">Password</label>
        </div>

        <div class="auth-form__actions">
          <button
            class="auth-btn auth-btn__login"
            type="submit"
            :disabled="loading"
          >
            <span x-show="!loading">Login</span>
            <span x-show="loading" x-cloak>…</span>
          </button>
          <button
            class="auth-btn auth-btn__register"
            type="button"
            @click="submitRegister"
            :disabled="loading"
          >
            Register
          </button>
        </div>
      </form>

      <!-- Modal Error -->
      <div
        class="error-modal"
        x-show="error"
        x-cloak
        x-transition.opacity
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="error-modal__title"
        @keydown.escape.window="closeError"
      >
        <div class="error-modal__box">
          <h3 id="error-modal__title" class="error-modal__title">Error</h3>
          <p class="error-modal__text" x-text="error"></p>
          <button
            class="error-modal__btn"
            type="button"
            x-ref="errorOk"
            @click="closeError"
          >
            OK
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
