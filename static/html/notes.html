<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notes go</title>
    <link rel="stylesheet" href="static/css/style.css" />
    <link
      rel="icon"
      href="https://img.icons8.com/?size=100&id=12581&format=png&color=000000"
    />
    <script type="module" src="static/js/notes.js"></script>
    <script defer src="static/js/pkg/alpine.js"></script>
  </head>
  <body>
    <div class="app" x-data="notesApp()">
      <div
        @visibilitychange.window="document.visibilityState === 'hidden' && forceSync()"
      ></div>

      <div class="sidebar">
        <div class="sidebar__header">
          <span>hi, <span x-text="username"></span>!</span>
          <span class="sidebar__logout" @click="logout">log out</span>
        </div>
        <div class="sidebar__sync-status" x-text="syncStatus"></div>
        <div class="sidebar__settings">
          <div class="sidebar__title">
            notes<span style="font-size: 10px">go</span>
          </div>
          <div class="sidebar__actions">
            <button
              class="sidebar__btn"
              @click="showDeleteModal = true"
              :disabled="!activeId"
            >
              ×
            </button>
            <button class="sidebar__btn" @click="createNote">+</button>
          </div>
        </div>
        <div class="sidebar__list">
          <template x-for="note in notes" :key="note.id">
            <a
              class="note-item"
              :class="{ 'active': note.id === activeId }"
              @click="switchNote(note.id)"
              x-text="(note.title || 'untitled') + (note.dirty ? ' •' : '')"
              draggable="true"
              @dragstart="onDragStart(note.id, $event)"
              @dragover="onDragOver($event)"
              @drop="onDrop(note.id, $event)"
              @dragend="onDragEnd()"
            ></a>
          </template>
        </div>
      </div>

      <div class="note-panel">
        <input
          class="note-panel__title"
          x-model="activeTitle"
          @input="onInput()"
          placeholder="untitled"
          autocomplete="off"
        />
        <textarea
          class="note-panel__content"
          x-model="activeContent"
          @input="onInput()"
          placeholder="Type something..."
          autocomplete="off"
        ></textarea>
      </div>

      <div class="error-modal" x-show="showErrorModal" x-cloak>
        <div class="error-modal__box">
          <h3 class="error-modal__title">error</h3>
          <p class="error-modal__text" x-text="errorMessage"></p>
          <button class="error-modal__btn" @click="showErrorModal = false">
            ok
          </button>
        </div>
      </div>

      <div class="delete-modal" x-show="showDeleteModal" x-cloak>
        <div class="delete-modal__box">
          <h3 class="delete-modal__title">delete</h3>
          <p class="delete-modal__text">
            Are you sure you want to delete this note?
          </p>
          <div class="delete-modal__actions">
            <button
              class="delete-modal__btn delete-modal__btn--cancel"
              @click="showDeleteModal = false"
            >
              cancel
            </button>
            <button
              class="delete-modal__btn delete-modal__btn--delete"
              @click="deleteNote()"
            >
              delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
