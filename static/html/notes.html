<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notes go</title>
    <link rel="stylesheet" href="static/css/style.css" />
    <link
      rel="icon"
      href="https://img.icons8.com/?size=100&id=12581&format=png&color=000000"
    />
  </head>
  <body>
    <div class="app">
      <div class="sidebar">
        <div class="sidebar__header">
          <span>hi, <span class="js-username"></span>!</span>
          <span class="sidebar__logout js-logout-btn">log out</span>
        </div>
        <div class="sidebar__sync-status js-sync-status">Synced</div>
        <div class="sidebar__settings">
          <div class="sidebar__title">
            notes<span style="font-size: 10px">go</span>
          </div>
          <div class="sidebar__actions">
            <button class="sidebar__btn js-note-delete-btn">×</button>
            <button class="sidebar__btn js-note-push-btn">⟳</button>
            <button class="sidebar__btn js-note-create-btn">+</button>
          </div>
        </div>
        <div class="sidebar__list js-notes-list"></div>
      </div>

      <div class="note-panel">
        <input
          type="text"
          class="note-panel__title js-note-title-input"
          autocomplete="off"
          placeholder="untitled"
          required
        />
        <textarea
          class="note-panel__content js-note-content-input"
          autocomplete="off"
          placeholder="Type something..."
        ></textarea>
      </div>
    </div>

    <div class="error-modal js-error-modal" hidden>
      <div
        class="error-modal__box"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="error-modal__title"
      >
        <h2 class="error-modal__title">error</h2>
        <p class="error-modal__text js-error-modal__text"></p>
        <button class="error-modal__btn js-error-modal__btn" type="button">
          ok
        </button>
      </div>
    </div>

    <div class="delete-modal js-delete-modal" hidden>
      <div
        class="delete-modal__box"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="delete-modal__title"
      >
        <h2 class="delete-modal__title">delete</h2>
        <p class="delete-modal__text js-delete-modal-text">
          Are you sure you want to delete this note?
        </p>
        <div class="delete-modal__actions">
          <button
            class="delete-modal__btn delete-modal__btn--cancel js-delete-modal-cancel"
            type="button"
          >
            cancel
          </button>
          <button
            class="delete-modal__btn delete-modal__btn--delete js-delete-modal-confirm"
            type="button"
          >
            delete
          </button>
        </div>
      </div>
    </div>

    <script src="static/js/notes.js"></script>
  </body>
</html>
