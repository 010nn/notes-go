<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notes</title>
    <link rel="stylesheet" href="static/css/style.css" />
    <link
      rel="icon"
      href="https://img.icons8.com/?size=100&id=12581&format=png&color=000000"
    />
  </head>
  <body>
    <div id="app-block">
      <div id="notes-sidebar">
        <div id="notes-header">
          <span>hi, <span id="username-display"></span>!</span>
          <span id="logout">log out</span>
        </div>
        <div id="sync-status">all changes saved</div>
        <div id="notes-settings">
          <div id="notes-list-name">notes</div>
          <div class="note-btns">
            <button class="note-btn js-note-btn-delete">×</button>
            <button class="note-btn js-note-btn-add">+</button>
          </div>
        </div>
        <div id="notes-list"></div>
      </div>

      <div class="note-panel">
        <input
          type="text"
          class="note-title"
          autocomplete="off"
          placeholder="untitled"
          required
        />
        <textarea
          id="note-content"
          placeholder="Type something..."
          spellcheck="false"
        ></textarea>
      </div>
    </div>

    <script src="static/js/notes.js"></script>
  </body>
</html>
